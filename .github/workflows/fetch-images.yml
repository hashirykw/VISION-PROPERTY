name: Copy images into the repo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [images.txt]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download images listed in images.txt
        run: python3 tools/fetch_images.py
      - name: Commit new images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add images
          git diff --cached --quiet && echo "No new images" && exit 0
          git commit -m "Copy site images into images/"
          git push
